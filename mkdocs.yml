site_name: StatConvert
site_description: Convert, inspect, validate, transform, and compare statistical datasets from the command line.
site_url: https://mrmeex.github.io/statconvert/
repo_name: mrmeex/statconvert
repo_url: https://github.com/mrmeex/statconvert
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 StatConvert

theme:
  name: material
  language: en
  icon:
    logo: material/swap-horizontal
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Guides:
      - User Guide: user-guide.md
      - Examples and Recipes: examples.md
      - Administrator Guide: admin-guide.md
  - Reference:
      - CLI Reference: cli.md
      - Formats and Backends: formats.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mrmeex/statconvert
      name: StatConvert on GitHub
